name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/api/requirements.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets
        run: |
          if grep -rnE "(xox[baprs]-[0-9A-Za-z-]+|gh[ps]_[0-9A-Za-z]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.md' \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Potential secret detected in repository."
            exit 1
          fi
          echo "No secret patterns detected."
